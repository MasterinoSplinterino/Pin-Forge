/* Ключи, описывающие сам файл и пресеты: их берём из чужого профиля как есть. */
const BASE_KEEP=['version','from','name','printer_technology',
                 'printer_settings_id','print_settings_id'];

function mergedConfig(p,pr){
  const ours=orcaConfig(p,pr);
  if(!baseProfile) return ours;
  const out=Object.assign({},baseProfile);
  Object.keys(ours).forEach(k=>{ if(BASE_KEEP.indexOf(k)<0) out[k]=ours[k]; });
  // с полным профилем обдув можно вернуть в проект: пресет пластика целый
  Object.keys(COOLING).forEach(k=>{
    out[k] = Array.isArray(out[k]) && out[k].length
      ? out[k].map(()=>COOLING[k])
      : [COOLING[k]];
  });
  return out;
}

/* Минимальный читатель zip: из .3mf нужен ровно один файл. */
function unzipFind(buf,wanted){
  const dv=new DataView(buf), u8=new Uint8Array(buf), dec=new TextDecoder();
  let eocd=-1;
  for(let i=u8.length-22;i>=0 && i>u8.length-66000;i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error('not a zip');
  const count=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  for(let n=0;n<count;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true);
    const csize=dv.getUint32(off+20,true);
    const nlen=dv.getUint16(off+28,true);
    const elen=dv.getUint16(off+30,true);
    const clen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=dec.decode(u8.subarray(off+46,off+46+nlen));
    if(name===wanted){
      const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
      const start=lho+30+lnlen+lelen;
      const raw=u8.subarray(start,start+csize);
      if(method===0) return dec.decode(raw);
      if(method===8 && typeof pako!=='undefined') return dec.decode(pako.inflateRaw(raw));
      throw new Error('compression '+method);
    }
    off += 46+nlen+elen+clen;
  }
  return null;
}

function renderBase(){
  const el=$('basename'), btn=$('baseclear');
  if(!el) return;
  el.textContent = baseProfile ? t('base.loaded',baseName,Object.keys(baseProfile).length)
                               : t('base.none');
  if(btn) btn.style.display = baseProfile ? '' : 'none';
}

async function useBaseFile(file){
  try{
    let txt;
    if(/\.3mf$/i.test(file.name)){
      txt=unzipFind(await file.arrayBuffer(),'Metadata/project_settings.config');
      if(!txt) throw new Error('project_settings.config');
    } else {
      txt=await file.text();
    }
    const cfg=JSON.parse(txt);
    if(!cfg || typeof cfg!=='object' || Array.isArray(cfg)) throw new Error('JSON');
    const n=Object.keys(cfg).length;
    if(n<120){ say(()=>t('msg.baseThin',n)); return; }
    baseProfile=cfg; baseName=file.name;
    try{ localStorage.setItem('pinforge.base',JSON.stringify({name:baseName,cfg:cfg})); }catch(e){}
    renderBase();
    say(()=>t('msg.baseOk',baseName,n),true);
  }catch(e){
    const m=e && e.message || String(e);
    say(()=>t('msg.baseFail',m));
  }
}

/* Настройки обдува показываем отдельно: без базового профиля они в проект
   не едут, их выставляют руками в своём профиле филамента. */
const COOLING = {
  fan_min_speed:'100', fan_max_speed:'100', slow_down_layer_time:'15',
  close_fan_the_first_x_layers:'1', fan_cooling_layer_time:'60'
};

/* Ключи, которые описывают сам файл, а не печать: в памятке они лишние. */
const RECIPE_SKIP = ['version','from','name','printer_technology',
                     'printer_settings_id','print_settings_id'];

function recipeConfig(p){
  const byTech = p.tech==='fdm02' ? PRINTERS.gen02 : PRINTERS.gen04;
  const chosen = ($('fmt').value==='3mf') ? PRINTERS[$('printer').value] : null;
  return orcaConfig(p, chosen || byTech);
}

function recipeLines(p){
  const c=recipeConfig(p), out=[];
  Object.keys(c).forEach(k=>{
    if(RECIPE_SKIP.indexOf(k)>=0) return;
    out.push([k, Array.isArray(c[k]) ? c[k].join(', ') : String(c[k])]);
  });
  Object.keys(COOLING).forEach(k=>out.push([k, COOLING[k]]));
  return out;
}

function renderRecipe(){
  const box=$('recipe'); if(!box) return;
  const p=readParams();
  if(p.tech==='msla'){
    box.innerHTML = t('recipe.msla').map(x=>'<p>'+x+'</p>').join('');
    box.className='recipe resin';
    return;
  }
  box.className='recipe';
  box.innerHTML = recipeLines(p)
    .map(r=>'<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
}

function recipeText(){
  const p=readParams();
  if(p.tech==='msla') return t('recipe.msla').join('\n');
  return recipeLines(p).map(r=>r[0]+' = '+r[1]).join('\n');
}

function make3MF(group,p,pr){
  const enc=new TextEncoder();
  const ct='<?xml version="1.0" encoding="UTF-8"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/>'+
    '<Default Extension="png" ContentType="image/png"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Target="/3D/3dmodel.model" Id="rel-1" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>';
  const ms='<?xml version="1.0" encoding="UTF-8"?>\n<config><object id="1">'+
    '<metadata key="name" value="'+logoName+'"/><metadata key="extruder" value="1"/>'+
    '<part id="1" subtype="normal_part"><metadata key="name" value="'+logoName+'"/></part></object></config>';
  const si='<?xml version="1.0" encoding="UTF-8"?>\n<config>'+
    '<header><header_item key="X-BBL-Client-Type" value="slicer"/>'+
    '<header_item key="X-BBL-Client-Version" value="01.09.00.15"/></header>'+
    '<plate><metadata key="index" value="1"/></plate></config>';
  return makeZip([
    {name:'[Content_Types].xml', data:enc.encode(ct)},
    {name:'_rels/.rels', data:enc.encode(rels)},
    {name:'3D/3dmodel.model', data:enc.encode(meshXML(group,pr.bed))},
    {name:'Metadata/model_settings.config', data:enc.encode(ms)},
    {name:'Metadata/slice_info.config', data:enc.encode(si)},
    {name:'Metadata/project_settings.config', data:enc.encode(JSON.stringify(mergedConfig(p,pr),null,2))}
  ]);
}

async function download(){
  const g=current; if(!g) return;
  const p=readParams();
  if($('fmt').value==='3mf'){
    const pr=PRINTERS[$('printer').value]||PRINTERS.k1c;
    let zip;
    try{ zip=make3MF(g,p,pr); }catch(e){ const em=e.message; say(()=>t('msg.mfFail',em)); return; }
    await saveBlob(new Blob([zip],{type:'application/vnd.ms-package.3dmanufacturing-3dmodel+xml'}),
                   logoName+'-pin.3mf');
    return;
  }
  const stl=toBinarySTL(g);
  const txt=new TextEncoder().encode(guideText(p,g.userData.meta));
  const zip=makeZip([
    {name:`${logoName}-pin.stl`,data:stl},
    {name:'print-notes.txt',data:txt}
  ]);
  const filename=`${logoName}-pin-${p.mode==='disc'?p.D+'mm':'contour'}.zip`;
  await saveBlob(new Blob([zip],{type:'application/zip'}),filename);
}

/* Опубликованная страница отдаёт файл через хост, а там белый список
   расширений: .3mf в него не входит, поэтому на отказ заворачиваем в zip. */
async function saveViaHost(dl,blob,filename){
  await dl.save({filename,data:blob});
}

async function saveBlob(blob,filename){
  let dl=null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }
  catch(e){ dl=null; }

  if(dl){
    try{
      await saveViaHost(dl,blob,filename);
      say(()=>t('msg.saved'),true);
      return;
    }catch(err){
      const code = err && err.code;
      if(code==='declined'){ say(()=>t('msg.cancelled')); return; }
      if(code==='rate_limited'){ say(()=>t('msg.rate')); return; }
      if(code==='rejected_extension' || code==='extension_not_enabled'){
        try{
          const raw=new Uint8Array(await blob.arrayBuffer());
          const zip=makeZip([{name:filename,data:raw}]);
          const zipName=filename.replace(/\.[^.]+$/,'')+'-3mf.zip';
          await saveViaHost(dl,new Blob([zip],{type:'application/zip'}),zipName);
          say(()=>t('msg.zipWrap',zipName),true);
          return;
        }catch(e2){
          if(e2 && e2.code==='declined'){ say(()=>t('msg.cancelled')); return; }
          const c2=(e2&&e2.code)||null; say(()=>t('msg.saveFail',c2||t('err.code')));
          return;
        }
      }
      say(()=>t('msg.saveFallback',code||t('err.code')));
    }
  }

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}

/* ============ UI ============ */
function markLoaded(name){
  const d=$('drop');
  if(!d) return;
  logoFileName = name || '';
  d.classList.add('loaded');
  $('drop-title').textContent = logoFileName || t('drop.done');
  $('drop-sub').textContent = t('drop.replace');
}

function loadSVGText(text,name){
  try{
    logoRings=parseSVGtoRings(text);
    if(name) logoName=name.replace(/\.svg$/i,'').replace(/[^\w\-]+/g,'-').slice(0,40)||'pin';
    markLoaded(name);
    try{ analysis=analyzeLogo(logoRings); }catch(e){ analysis=null; }
    const nr=logoRings.length; say(()=>t('msg.parsed',nr),true);
    refresh();
  }catch(e){
    say(e.message||String(e));
  }
}

function wire(){
  const drop=$('drop'), file=$('file');
  drop.addEventListener('click',()=>file.click());
  file.addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    f.text().then(t=>loadSVGText(t,f.name));
  });
  const zones=[drop, document.querySelector('.stage')].filter(Boolean);
  zones.forEach(z=>{
    ;['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot');}));
    ;['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot');}));
    z.addEventListener('drop',e=>{
      const f=e.dataTransfer && e.dataTransfer.files[0]; if(!f) return;
      f.text().then(t=>loadSVGText(t,f.name));
    });
  });
  const det=document.querySelector('.loadbar details'), stage=document.querySelector('.stage');
  if(det && stage) det.addEventListener('toggle',()=>{
    stage.classList.toggle('nostick', det.open);
  });
  $('rawgo').addEventListener('click',()=>{
    const t=$('raw').value.trim();
    if(t) loadSVGText(t,logoName);
  });
  const sliders=['diam','thick','cham','dome','logo','rel','bev','grow','draft','ring','wall','fwall','marg','rad'];
  const sliderLabels=[];
  sliders.forEach(id=>{
    const el=$(id);
    const lab=()=>{
      const v=+el.value;
      $('v-'+id).textContent=(id==='grow'&&v>0?'+':'')+v.toFixed(2).replace(/0$/,'').replace(/\.$/,'')+t('u.mmSuffix');
    };
    const upd=()=>{ lab(); refresh(); };
    sliderLabels.push(lab);
    el.addEventListener('input',upd); upd();
  });
  UI.sliders=()=>sliderLabels.forEach(f=>f());
  $('insert').addEventListener('change',()=>{
    const v=INS[$('insert').value];
    if(v && v.d){
      $('pd').value=v.d; $('pdep').value=v.t;
      $('seat').value = v.mag ? 'socket' : 'flat';
      if(v.mag && $('mount').value==='auto') $('mount').value='inset';
      const mv=$('mount').value;
      if(v.mag && mv==='pocket' && +$('thick').value < v.t+ +$('lid').value+ +$('fwall').value){
        $('thick').value=Math.min(8,(v.t+ +$('lid').value+ +$('fwall').value+0.2)).toFixed(1);
        $('v-thick').textContent=$('thick').value+t('u.mmSuffix');
      }
      if(v.mag && mv.indexOf('boss')===0)
        $('bh').value=(v.t+ +$('lid').value+0.6).toFixed(1);
      if(!v.mag && mv.indexOf('boss')===0) $('bh').value='0.8';
    }
    syncRows(); refresh();
  });
  $('inv').addEventListener('change',()=>{
    if($('inv').checked && $('mode').value==='cut' && +$('ring').value<1.5){
      $('ring').value=2.2; $('v-ring').textContent='2.2'+t('u.mmSuffix');
    }
  });
  $('lcenter').addEventListener('click',()=>{
    const c=letterBandCenter();
    if(!c) return;
    $('lx').value=c.x.toFixed(2); $('ly').value=c.y.toFixed(2);
    refresh();
  });
  ['mode','inv','mount','insert','seat','lid','lidon','autoth','zone','bd','bh','bsp','pd','pdep','ox','oy','lx','ly','plate','solid','tech'].forEach(id=>$(id).addEventListener('input',()=>{
    syncRows(); renderRecipe(); refresh();
  }));
  function syncRows(){
    const mv=$('mode').value, mt=$('mount').value;
    document.querySelectorAll('[data-only]').forEach(r=>{
      r.style.display = r.dataset.only===mv ? '' : 'none';
    });
    document.querySelectorAll('[data-hide]').forEach(r=>{
      r.style.display = r.dataset.hide===mv ? 'none' : '';
    });
    const ins=INS[$('insert').value], seat=$('seat').value;
    document.querySelectorAll('[data-seat]').forEach(r=>{
      r.style.display = (r.dataset.seat===seat && mt!=='none') ? '' : 'none';
    });
    document.querySelectorAll('[data-ins]').forEach(r=>{
      r.style.display = (ins && ins.mag && mt!=='none' && seat==='socket') ? '' : 'none';
    });
    document.querySelectorAll('[data-mount]').forEach(r=>{
      const on = r.dataset.mount==='bossmanual' ? (mt==='boss'||mt==='boss2') : (r.dataset.mount==='boss2manual' ? mt==='boss2' : mt===r.dataset.mount);
      r.style.display = on ? '' : 'none';
    });
  }
  syncRows();
  let flipped=false;
  const updFlip=()=>{ $('flip').textContent = flipped ? t('flip.front') : t('flip.back'); };
  const updView=()=>{
    $('vtop').setAttribute('aria-pressed', view==='top' ? 'true' : 'false');
    $('vbot').setAttribute('aria-pressed', view==='bottom' ? 'true' : 'false');
    $('vspin').setAttribute('aria-pressed', spin ? 'true' : 'false');
  };
  UI.flip=()=>{ updFlip(); updView(); };
  updFlip(); updView();
  $('flip').addEventListener('click',()=>{
    flipped=!flipped;
    rot.x=flipped?1.35:-0.55; autoT=0;
    view='free';
    lightBelow=flipped;
    fitShadow(lastSpan||46);
    updFlip(); updView();
  });
  // повторное нажатие возвращает свободное вращение
  const setView=v=>{
    view = (view===v) ? 'free' : v;
    if(view!=='free'){ rot.z=0; flipped = (view==='bottom'); updFlip(); }
    lightBelow = (view==='bottom');
    fitShadow(lastSpan||46);
    autoT=0;
    updView();
  };
  $('vtop').addEventListener('click',()=>setView('top'));
  $('vbot').addEventListener('click',()=>setView('bottom'));
  $('vspin').addEventListener('click',()=>{
    spin=!spin;
    try{ localStorage.setItem('pinforge.spin', spin?'1':'0'); }catch(e){}
    if(!spin) autoT=0;
    updView();
  });
  const psel=$('printer');
  const buildPrinters=()=>{
    const cur=psel.value;
    psel.innerHTML='';
    Object.keys(PRINTERS).forEach(k=>{
      const o=document.createElement('option'); o.value=k;
      o.textContent = PRINTERS[k].i18n ? t(PRINTERS[k].i18n) : PRINTERS[k].name;
      psel.appendChild(o);
    });
    if(cur) psel.value=cur;
  };
  UI.printers=buildPrinters; buildPrinters();
  const syncFmt=()=>{
    const f=$('fmt').value;
    document.querySelectorAll('[data-fmt]').forEach(r=>{ r.style.display = r.dataset.fmt===f?'':'none'; });
    $('dl').textContent = f==='3mf' ? t('dl.3mf') : t('dl.zip');
    renderRecipe();
  };
  UI.fmt=syncFmt;
  UI.recipe=()=>{ renderRecipe(); renderBase(); };
  $('basebtn').addEventListener('click',()=>$('basefile').click());
  $('basefile').addEventListener('change',e=>{
    const f=e.target.files[0];
    if(f) useBaseFile(f);
    e.target.value='';
  });
  $('baseclear').addEventListener('click',()=>{
    baseProfile=null; baseName='';
    try{ localStorage.removeItem('pinforge.base'); }catch(e){}
    renderBase();
  });
  renderBase();
  psel.addEventListener('change',renderRecipe);
  $('recipe-copy').addEventListener('click',async()=>{
    const btn=$('recipe-copy'), txt=recipeText();
    let ok=false;
    try{ await navigator.clipboard.writeText(txt); ok=true; }
    catch(e){
      // в песочнице буфер может быть закрыт, тогда старый способ
      try{
        const ta=document.createElement('textarea');
        ta.value=txt; ta.setAttribute('readonly','');
        ta.style.cssText='position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta); ta.select();
        ok=document.execCommand('copy');
        ta.remove();
      }catch(e2){ ok=false; }
    }
    if(ok){
      btn.textContent=t('recipe.copied');
      setTimeout(()=>{ btn.textContent=t('recipe.copy'); },1500);
    }
  });
  $('fmt').addEventListener('change',()=>{
    if($('fmt').value==='3mf'){
      const t=$('tech').value;
      psel.value = t==='fdm02' ? 'gen02' : 'k1c';
    }
    syncFmt();
  });
  syncFmt();
  $('dl').addEventListener('click',download);

  // состояние разделов переживает перезагрузку
  let grpState={};
  try{ grpState=JSON.parse(localStorage.getItem('pinforge.groups')||'{}')||{}; }catch(e){ grpState={}; }
  // справочные разделы всегда стартуют свёрнутыми: их читают, а не крутят
  const ALWAYS_SHUT=['grp-check','grp-recipe'];
  document.querySelectorAll('details.grp').forEach(d=>{
    if(!d.id) return;
    if(ALWAYS_SHUT.indexOf(d.id)>=0){ d.open=false; return; }
    if(typeof grpState[d.id]==='boolean') d.open=grpState[d.id];
    d.addEventListener('toggle',()=>{
      grpState[d.id]=d.open;
      try{ localStorage.setItem('pinforge.groups',JSON.stringify(grpState)); }catch(e){}
    });
  });
  document.querySelectorAll('[data-lang]').forEach(b=>{
    b.addEventListener('click',()=>setLang(b.dataset.lang));
  });
}

(function pickLang(){
  let l=null;
  try{ l=localStorage.getItem('pinforge.lang'); }catch(e){}
  if(l!=='ru' && l!=='en'){
    const nav=String(navigator.language||'ru').toLowerCase();
    l = nav.indexOf('ru')===0 ? 'ru' : 'en';
  }
  LANG=l;
})();

if(!THREE_OK){
  say(()=>t('msg.noThree'));
} else {
  initScene();
}
wire();
if(THREE_OK) say(()=>t('msg.start'));
applyLang();
